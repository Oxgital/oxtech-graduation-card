<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oxtech Academy — Graduation Card</title>
<!--
  OXTECH ACADEMY GRADUATION CARD — pure HTML / CSS / JS

  HOW TO USE
  • As its own page: upload this file, or
  • In WordPress/Elementor: add an "HTML" widget to your graduation-card page and paste
    everything from "START" to "END" below.

  BEFORE GOING LIVE
  1. Replace the logo URL (search "REPLACE-WITH-YOUR-LOGO") with your white logo from the Media Library.
  2. Check the cohort name ("Wave One Cohort" appears twice: in the card caption and in the settings).
  3. Edit the course list in the settings at the bottom if needed.
-->
</head>
<body style="margin:0;padding:32px 16px;background:#F4F6FA">

<!-- ===================== START (paste from here into Elementor) ===================== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js" data-no-optimize="1" data-cfasync="false"></script>

<div class="oxg" id="oxg">

	<!-- ============ PREVIEW ============ -->
	<div class="oxg-stage">
		<div class="oxg-card" id="oxg-card">

			<!-- background, confetti, sparkles -->
			<svg class="oxg-bg" aria-hidden="true" width="1080" height="1350" viewBox="0 0 1080 1350">
				<defs>
					<linearGradient id="oxg-bg" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#3A8BFF"/><stop offset="0.5" stop-color="#2377F7"/><stop offset="1" stop-color="#1A60D8"/></linearGradient>
					<radialGradient id="oxg-halo" cx="50%" cy="45%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity="0.2"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
					<linearGradient id="oxg-foil" x1="0" y1="0" x2="1" y2="0.3"><stop offset="0" stop-color="#8A5A08"/><stop offset="0.18" stop-color="#E9B33A"/><stop offset="0.35" stop-color="#FFF1BF"/><stop offset="0.5" stop-color="#E2A92C"/><stop offset="0.7" stop-color="#9C6A0E"/><stop offset="0.85" stop-color="#F5CC5C"/><stop offset="1" stop-color="#B07C14"/></linearGradient>
					<filter id="oxg-blur-lg" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
					<filter id="oxg-blur-md" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
					<path id="oxg-curl" d="M0 40 C 30 -10, 110 -20, 150 30 C 160 45, 158 70, 140 86 L 118 66 C 128 56, 126 44, 118 36 C 92 8, 40 16, 22 58 Z"/>
					<path id="oxg-strip" d="M0 0 C 50 20, 120 10, 170 -30 L 200 10 C 140 60, 60 70, -10 44 Z"/>
				</defs>
				<rect width="1080" height="1350" fill="url(#oxg-bg)"/>
				<ellipse cx="540" cy="520" rx="560" ry="520" fill="url(#oxg-halo)"/>
				<use href="#oxg-strip" fill="url(#oxg-foil)" transform="translate(850 40) rotate(12) scale(1.5)" filter="url(#oxg-blur-lg)"/>
				<use href="#oxg-curl"  fill="url(#oxg-foil)" transform="translate(50 250) rotate(-22) scale(0.8)"/>
				<use href="#oxg-strip" fill="url(#oxg-foil)" transform="translate(930 560) rotate(-38)" filter="url(#oxg-blur-md)"/>
				<use href="#oxg-curl"  fill="url(#oxg-foil)" transform="translate(-60 960) rotate(48) scale(1.25)" filter="url(#oxg-blur-lg)"/>
				<use href="#oxg-strip" fill="url(#oxg-foil)" transform="translate(880 1250) rotate(-55) scale(1.6)" filter="url(#oxg-blur-lg)"/>
				<path d="M965 330 l10 30 l30 10 l-30 10 l-10 30 l-10 -30 l-30 -10 l30 -10 z" fill="#fff"/>
				<path d="M130 560 l9 27 l27 9 l-27 9 l-9 27 l-9 -27 l-27 -9 l27 -9 z" fill="#FFC93C"/>
			</svg>

			<!-- logo -->
			<img class="oxg-logo" id="oxg-logo" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 360 120'%3E%3Crect width='360' height='120' rx='16' fill='rgba(255,255,255,0.08)'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-family='Poppins, Arial, sans-serif' font-size='42' letter-spacing='4'%3EOXTECH%3C/text%3E%3Ctext x='50%25' y='82%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-family='Poppins, Arial, sans-serif' font-size='12' letter-spacing='12'%3EACADEMY%3C/text%3E%3C/svg%3E" alt="Oxtech Academy" crossorigin="anonymous"
				     onerror="this.hidden=true;document.getElementById('oxg-logo-text').hidden=false">
				<div class="oxg-logo oxg-logo-text" id="oxg-logo-text" hidden><span>OXTECH</span><small>ACADEMY</small></div>

			<!-- polaroids -->
			<div class="oxg-polaroid-back"></div>
			<div class="oxg-polaroid">
				<div class="oxg-photo" id="oxg-photo">
					<img class="oxg-img" id="oxg-img" alt="" hidden>
					<div class="oxg-empty" id="oxg-empty" aria-label="Upload your photo">
						<svg viewBox="0 0 558 558" width="558" height="558" aria-hidden="true"><circle cx="279" cy="215" r="105" fill="#FFFFFF"/><path d="M64 558 C 64 420, 160 345, 279 345 C 398 345, 494 420, 494 558 Z" fill="#FFFFFF"/></svg>
					</div>
				</div>
				<div class="oxg-caption">Wave One Cohort</div>
			</div>
			<div class="oxg-tape"></div>

			<!-- certified badge -->
			<svg class="oxg-badge" viewBox="-130 -130 260 260" role="img" aria-label="Certified graduate">
				<defs>
				</defs>
				<path class="oxg-badge-edge" fill="#FFC93C" d=""/>
				<circle r="88" fill="none" stroke="#0F1B3D" stroke-opacity="0.18" stroke-width="2"/>
				<g class="oxg-badge-ring" font-family="Poppins, sans-serif" font-size="14" font-weight="700" fill="#0F1B3D" text-anchor="middle"></g>
				<circle r="42" fill="#0F1B3D"/>
				<path d="M-17 1 L-5 13 L18 -11" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
			</svg>

			<!-- text -->
			<div class="oxg-text">
				<div class="oxg-lead">Proud graduate of Oxtech Academy</div>
				<div class="oxg-name" id="oxg-name"></div>
				<div class="oxg-course" id="oxg-course"></div>
			</div>
			<div class="oxg-footer">oxtechacademy.com</div>
		</div>
	</div>

	<!-- ============ FORM ============ -->
	<form class="oxg-form" onsubmit="return false">
		<h2>Your graduation card</h2>
		<p class="oxg-sub">Check your details, add a photo you love, then share it.</p>

		<label>Name on card <input type="text" id="oxg-in-name" maxlength="40" autocomplete="name" placeholder="e.g. Ogbodo Oluebube"></label>
		<label id="oxg-course-wrap">Course <select id="oxg-in-course"></select></label>

		<div class="oxg-field">
			<span class="oxg-label">Photo</span>
			<label class="oxg-upload"><input type="file" id="oxg-in-file" accept="image/*"><span>Upload a photo</span></label>
			<label class="oxg-zoom">Zoom <input type="range" id="oxg-in-zoom" min="1" max="3" step="0.01" value="1"></label>
			<p class="oxg-hint" id="oxg-hint"></p>
		</div>

		<div class="oxg-actions">
			<button type="button" class="oxg-primary" id="oxg-share">Share card</button>
			<button type="button" id="oxg-download">Download PNG</button>
			<button type="button" id="oxg-copy">Copy caption</button>
		</div>
		<p class="oxg-status" id="oxg-status" role="status"></p>
	</form>
</div>

<style>
/* ============ PAGE LAYOUT ============ */
.oxg{display:grid;gap:32px;grid-template-columns:minmax(0,460px) minmax(0,1fr);align-items:start;max-width:1100px;margin:0 auto;font-family:Poppins,system-ui,sans-serif;color:#0F1B3D}
.oxg-stage{position:relative;width:100%;aspect-ratio:1080/1350;overflow:hidden;border-radius:14px;box-shadow:0 20px 50px rgba(15,27,61,.18)}
@media (max-width:820px){.oxg{grid-template-columns:1fr}}

/* ============ CARD STYLES (1080 x 1350) ============ */
.oxg-card{position:absolute;left:0;top:0;width:1080px;height:1350px;overflow:hidden;transform-origin:0 0;transform:scale(var(--oxg-scale,.4));color:#fff;font-family:Poppins,sans-serif;background:#2377F7}
.oxg-card *{box-sizing:border-box}
.oxg [hidden]{display:none!important}
.oxg-bg{position:absolute;left:0;top:0;width:1080px!important;height:1350px!important;max-width:none!important}

.oxg-logo{position:absolute;left:425px;top:32px;width:230px;height:auto}
.oxg-logo-text{display:flex;flex-direction:column;align-items:center;gap:2px}
.oxg-logo-text span{font-size:46px;font-weight:400;letter-spacing:3px;line-height:1}
.oxg-logo-text small{font-size:12px;font-weight:600;letter-spacing:15px;margin-right:-15px}

.oxg-polaroid-back{position:absolute;left:225px;top:170px;width:630px;height:760px;background:#F1F4F9;transform:rotate(-5deg);box-shadow:0 20px 40px rgba(10,42,112,.3)}
.oxg-polaroid{position:absolute;left:225px;top:160px;width:630px;height:760px;padding:36px 36px 0;background:#fff;transform:rotate(2.5deg);box-shadow:0 2px 4px rgba(10,42,112,.25),0 30px 60px rgba(10,42,112,.4);display:flex;flex-direction:column;align-items:center}
.oxg-photo{position:relative;width:558px;height:558px;flex:0 0 auto;overflow:hidden;background:#D7DEEA;touch-action:none}
.oxg-photo.has-photo{cursor:grab}
.oxg-photo.has-photo:active{cursor:grabbing}
.oxg-img{position:absolute;max-width:none!important;user-select:none;-webkit-user-drag:none;pointer-events:none}
.oxg-empty{position:absolute;inset:0;background:#D7DEEA}
.oxg-empty svg{display:block;width:100%;height:100%}
.oxg-caption{margin-top:34px;font-family:Caveat,cursive;font-weight:700;font-size:70px;line-height:1;color:#0F1B3D;white-space:nowrap}

.oxg-tape{position:absolute;left:440px;top:128px;width:200px;height:58px;background:rgba(255,201,60,.85);transform:rotate(-3deg);clip-path:polygon(0 8%,4% 0,8% 10%,12% 0,88% 0,92% 10%,96% 0,100% 8%,100% 92%,96% 100%,92% 90%,88% 100%,12% 100%,8% 90%,4% 100%,0 92%)}

.oxg-badge{position:absolute;left:750px;top:760px;width:260px;height:260px;transform:rotate(10deg);overflow:visible;filter:drop-shadow(0 12px 14px rgba(10,42,112,.35))}

.oxg-text{position:absolute;left:60px;right:60px;top:990px;display:flex;flex-direction:column;align-items:center;text-align:center}
.oxg-lead{font-size:30px;font-weight:300}
.oxg-name{margin-top:10px;font-size:82px;font-weight:800;line-height:1;letter-spacing:-1px;text-transform:uppercase;white-space:nowrap}
.oxg-course{margin-top:14px;font-size:36px;font-weight:700;color:#FFC93C;white-space:nowrap}
.oxg-footer{position:absolute;left:0;right:0;bottom:48px;text-align:center;font-size:20px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:#DCE8FF}

/* ============ FORM ============ */
.oxg-form{display:grid;gap:18px}
.oxg-form h2{margin:0;font-size:28px;font-weight:700}
.oxg-sub{margin:-10px 0 0;opacity:.7}
.oxg-form label,.oxg-label{display:grid;gap:6px;font-size:14px;font-weight:600}
.oxg-form input[type=text],.oxg-form select{padding:12px 14px;border:1px solid #CBD3E3;border-radius:10px;font:400 15px Poppins,sans-serif}
.oxg-field{display:grid;gap:10px}
.oxg-upload{position:relative;display:flex!important;align-items:center;justify-content:center;min-height:52px;border:2px dashed #9DBDF5;border-radius:10px;background:#F4F8FF;color:#2377F7;cursor:pointer}
.oxg-upload input[type=file]{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;margin:0!important;padding:0!important;opacity:0!important;display:block!important;cursor:pointer;z-index:2}
.oxg-photo:not(.has-photo){cursor:pointer}
.oxg-zoom{grid-template-columns:auto 1fr;align-items:center}
.oxg-zoom input{accent-color:#2377F7}
.oxg-hint,.oxg-status{margin:0;font-size:13px;opacity:.75;min-height:1.2em}
.oxg-actions{display:flex;flex-wrap:wrap;gap:10px}
.oxg-form button{padding:13px 20px;border-radius:10px;border:2px solid #2377F7;background:#fff;color:#2377F7;font:600 15px Poppins,sans-serif;cursor:pointer}
.oxg-form button.oxg-primary{background:#2377F7;color:#fff}
.oxg-form :focus-visible,.oxg-upload:focus-within{outline:3px solid #FFC93C;outline-offset:2px}
.oxg-sheet{position:fixed;inset:0;z-index:99999;background:rgba(15,27,61,.7);display:flex;align-items:center;justify-content:center;padding:16px}
.oxg-sheet[hidden]{display:none!important}
.oxg-sheet-box{background:#fff;border-radius:16px;padding:18px;max-width:420px;width:100%;max-height:100%;overflow:auto;font-family:Poppins,sans-serif;color:#0F1B3D;text-align:center}
.oxg-sheet-box img{display:block;width:100%;height:auto;border-radius:10px}
.oxg-sheet-box p{font-size:14px;margin:12px 0}
.oxg-sheet-actions{display:flex;gap:10px;justify-content:center}
.oxg-sheet-actions a,.oxg-sheet-actions button{padding:12px 20px;border-radius:10px;font:600 15px Poppins,sans-serif;cursor:pointer;text-decoration:none}
.oxg-sheet-save{background:#2377F7;color:#fff!important}
.oxg-sheet-close{background:#fff;color:#2377F7;border:2px solid #2377F7}
</style>

<script>
(function () {
	const cfg   = {
		name: 'Your Name',
		cohort: 'Wave One Cohort',                 // ← change for each cohort (also change the caption text in the card above)
		courses: ["Artificial Intelligence (AI)", "Content Marketing & SEO", "Cybersecurity", "Data Analysis", "Digital Marketing", "Frontend Development", "Introtech", "Product Design (UI/UX)", "Project Management", "Social Media Management/Marketing", "Virtual Assistant"],
		photo: ''
	};
	const $     = id => document.getElementById(id);
	const card  = $('oxg-card'), stage = card.parentElement;
	const box   = $('oxg-photo'), img = $('oxg-img');
	const nameIn = $('oxg-in-name'), courseIn = $('oxg-in-course'), zoomIn = $('oxg-in-zoom');
	const BOX = 558, TILT = 2.5 * Math.PI / 180;
	let zoom = 1, offX = 0, offY = 0, scale = 1;

	/* background art: turn the inline SVG into a self-contained image so the PNG export keeps the gold foil */
	(function () {
		const svg = card.querySelector('.oxg-bg');
		svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
		const art = new Image();
		art.className = 'oxg-bg'; art.alt = ''; art.setAttribute('aria-hidden', 'true');
		art.width = 1080; art.height = 1350;
		art.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(svg));
		svg.replaceWith(art);
	})();

	/* badge wavy edge */
	let d = '';
	for (let i = 0; i < 360; i++) { const t = i / 180 * Math.PI, r = 104 + 5 * Math.cos(16 * t); d += (i ? 'L' : 'M') + (r * Math.cos(t)).toFixed(2) + ' ' + (r * Math.sin(t)).toFixed(2); }
	document.querySelector('.oxg-badge-edge').setAttribute('d', d + 'Z');

	/* badge ring text: one letter per element (reliable in every browser and in the PNG export) */
	function ringText() {
		const g = document.querySelector('.oxg-badge-ring'), txt = 'CERTIFIED GRADUATE • OXTECH ACADEMY •', R = 70;
		const m = document.createElement('canvas').getContext('2d'); m.font = '700 14px Poppins, sans-serif';
		g.innerHTML = ''; let a = Math.PI;
		for (const ch of txt) {
			const step = (m.measureText(ch).width + 2.6) / R, mid = a + step / 2;
			const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
			t.setAttribute('transform', `translate(${(R * Math.cos(mid)).toFixed(2)} ${(R * Math.sin(mid)).toFixed(2)}) rotate(${(mid * 180 / Math.PI + 90).toFixed(2)})`);
			t.textContent = ch; g.appendChild(t); a += step;
		}
	}

	/* scale the 1080px card to the preview box */
	function fitStage() { scale = stage.clientWidth / 1080; card.style.setProperty('--oxg-scale', scale); }
	new ResizeObserver(fitStage).observe(stage); fitStage();

	/* shrink text that would overflow */
	function shrink(el, max, size) { el.style.fontSize = size + 'px'; while (el.scrollWidth > max && size > 24) el.style.fontSize = (size -= 2) + 'px'; }

	/* fill details */
	cfg.courses.forEach(c => courseIn.add(new Option(c, c)));
	function update() {
		$('oxg-name').textContent = nameIn.value.trim() || cfg.name;
		$('oxg-course').textContent = courseIn.value;
		shrink($('oxg-name'), 960, 82);
		shrink($('oxg-course'), 960, 36);
		shrink(document.querySelector('.oxg-caption'), 560, 70);
	}
	nameIn.addEventListener('input', update);
	courseIn.addEventListener('change', update);

	/* photo: cover-fit, zoom, drag */
	function placePhoto() {
		if (!img.naturalWidth) return;
		const s = Math.max(BOX / img.naturalWidth, BOX / img.naturalHeight) * zoom;
		const w = img.naturalWidth * s, h = img.naturalHeight * s;
		const mx = (w - BOX) / 2, my = (h - BOX) / 2;
		offX = Math.max(-mx, Math.min(mx, offX)); offY = Math.max(-my, Math.min(my, offY));
		Object.assign(img.style, { width: w + 'px', height: h + 'px', left: (BOX - w) / 2 + offX + 'px', top: (BOX - h) / 2 + offY + 'px' });
	}
	const fileIn = $('oxg-in-file'), say = t => { $('oxg-status').textContent = t; };

	function setPhoto(src) {
		img.onload = () => {
			img.hidden = false; $('oxg-empty').hidden = true; box.classList.add('has-photo');
			zoom = 1; zoomIn.value = 1; offX = offY = 0; placePhoto();
			$('oxg-hint').textContent = 'Use zoom, or drag the photo on the card to frame it.';
			say('');
		};
		img.onerror = () => say('That photo could not be opened. Please try a JPG or PNG.');
		if (/^https?:/.test(src)) img.crossOrigin = 'anonymous'; else img.removeAttribute('crossorigin');
		img.src = src;
	}

	/* read the file → shrink very large photos → show on the card */
	function readFile(f) {
		if (!f) return;
		if (/heic|heif/i.test(f.type) || /\.(heic|heif)$/i.test(f.name)) {
			say('This photo is in iPhone HEIC format. Please pick a JPG or PNG, or upload a screenshot of the photo.'); return;
		}
		if (f.type && !/^image\//.test(f.type)) { say('Please choose an image file (JPG or PNG).'); return; }
		say('Loading your photo…');
		const reader = new FileReader();
		reader.onerror = () => say('That photo could not be read. Please try another one.');
		reader.onload = () => {
			const probe = new Image();
			probe.onerror = () => say('That photo could not be opened. Please try a JPG or PNG.');
			probe.onload = () => {
				const max = 1600, k = Math.min(1, max / Math.max(probe.naturalWidth, probe.naturalHeight));
				if (k === 1) return setPhoto(reader.result);
				const c = document.createElement('canvas');
				c.width = Math.round(probe.naturalWidth * k); c.height = Math.round(probe.naturalHeight * k);
				c.getContext('2d').drawImage(probe, 0, 0, c.width, c.height);
				setPhoto(c.toDataURL('image/jpeg', 0.92));
			};
			probe.src = reader.result;
		};
		reader.readAsDataURL(f);
	}
	fileIn.addEventListener('change', () => { readFile(fileIn.files[0]); fileIn.value = ''; });

	/* tap the empty photo on the card to upload, or drag & drop a photo onto it */
	box.addEventListener('click', () => { if (img.hidden) fileIn.click(); });
	[box, document.querySelector('.oxg-upload')].forEach(el => {
		el.addEventListener('dragover', e => { e.preventDefault(); });
		el.addEventListener('drop', e => { e.preventDefault(); readFile(e.dataTransfer.files[0]); });
	});
	zoomIn.addEventListener('input', () => { zoom = +zoomIn.value; placePhoto(); });

	let last = null;
	box.addEventListener('pointerdown', e => { if (img.hidden) return; last = { x: e.clientX, y: e.clientY }; box.setPointerCapture(e.pointerId); });
	box.addEventListener('pointermove', e => {
		if (!last) return;
		const dx = (e.clientX - last.x) / scale, dy = (e.clientY - last.y) / scale;
		offX += dx * Math.cos(TILT) + dy * Math.sin(TILT);
		offY += -dx * Math.sin(TILT) + dy * Math.cos(TILT);
		last = { x: e.clientX, y: e.clientY }; placePhoto();
	});
	['pointerup', 'pointercancel'].forEach(t => box.addEventListener(t, () => { last = null; }));

	/* ---------- export HTML → PNG (with fallbacks) ---------- */
	const status = $('oxg-status');
	const caption = () => `I just completed the ${courseIn.value} programme at Oxtech Academy (${cfg.cohort})! 🎓 Grateful for the journey and excited for what's next. #OxtechAcademy #LearnTechWithOxtech`;
	const toDataURL = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });

	// 1. make sure the export library is loaded (tries 3 CDNs)
	function loadLib() {
		if (window.htmlToImage) return Promise.resolve();
		const urls = ['https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js',
		              'https://unpkg.com/html-to-image@1.11.11/dist/html-to-image.js',
		              'https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.js'];
		return urls.reduce((p, u) => p.catch(() => new Promise((res, rej) => {
			const sc = document.createElement('script'); sc.src = u;
			sc.onload = () => window.htmlToImage ? res() : rej(); sc.onerror = rej; document.head.appendChild(sc);
		})), Promise.reject());
	}

	// 2. embed the logo as data so it can never block the export
	const logoImg = $('oxg-logo');
	const logoReady = (async () => {
		if (!logoImg || logoImg.hidden || /^data:/.test(logoImg.src)) return;
		try { logoImg.src = await toDataURL(await (await fetch(logoImg.src, { mode: 'cors' })).blob()); }
		catch (_) { logoImg.hidden = true; $('oxg-logo-text').hidden = false; }
	})();

	// 3. embed only our own fonts (skips theme stylesheets that can break the export)
	let fontCSS = null;
	async function getFontCSS() {
		if (fontCSS !== null) return fontCSS;
		try {
			let css = await (await fetch('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&family=Caveat:wght@700&display=swap')).text();
			const urls = [...new Set(css.match(/https:[^)]+\.woff2/g) || [])];
			await Promise.all(urls.map(async u => { css = css.split(u).join(await toDataURL(await (await fetch(u)).blob())); }));
			fontCSS = css;
		} catch (_) { fontCSS = ''; }
		return fontCSS;
	}

	async function render() {
		await Promise.all([loadLib(), logoReady, document.fonts.ready]);
		const opts = {
			width: 1080, height: 1350, pixelRatio: 1, cacheBust: true,
			style: { transform: 'none', left: '0', top: '0' },
			fontEmbedCSS: await getFontCSS(),
			imagePlaceholder: 'data:image/gif;base64,R0lGODlhAQABAAAAACw=',
		};
		await htmlToImage.toPng(card, opts);              // warm-up pass (Safari needs it)
		const blob = await htmlToImage.toBlob(card, opts);
		if (!blob || blob.size < 1000) throw new Error('empty');
		return blob;
	}

	// 4. result window: always lets the student save, even where downloads are blocked
	const sheet = document.createElement('div');
	sheet.className = 'oxg-sheet'; sheet.hidden = true;
	sheet.innerHTML = '<div class="oxg-sheet-box" role="dialog" aria-modal="true" aria-label="Your card is ready">' +
		'<img alt="Your graduation card"><p>On a phone? Press and hold the image, then tap <b>Save image</b>.</p>' +
		'<div class="oxg-sheet-actions"><a class="oxg-sheet-save" download="oxtech-graduation-card.png">Save image</a>' +
		'<button type="button" class="oxg-sheet-close">Close</button></div></div>';
	document.body.appendChild(sheet);
	sheet.querySelector('.oxg-sheet-close').onclick = () => { sheet.hidden = true; };
	sheet.addEventListener('click', e => { if (e.target === sheet) sheet.hidden = true; });

	let lastURL = null;
	async function makeCard() {
		status.textContent = 'Preparing your card…';
		const blob = await Promise.race([render(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 25000))]);
		if (lastURL) URL.revokeObjectURL(lastURL);
		lastURL = URL.createObjectURL(blob);
		return blob;
	}
	function showSheet(url) {
		sheet.querySelector('img').src = url; sheet.querySelector('.oxg-sheet-save').href = url; sheet.hidden = false;
	}
	async function download() {
		try {
			await makeCard();
			const a = document.createElement('a'); a.href = lastURL; a.download = 'oxtech-graduation-card.png';
			document.body.appendChild(a); a.click(); a.remove();
			const inApp = /FBAN|FBAV|Instagram|WhatsApp|Line\/|Snapchat|TikTok|iPhone|iPad/i.test(navigator.userAgent);
			if (inApp) showSheet(lastURL);
			status.textContent = 'Card downloaded. Check your Downloads (or the window that opened).';
		} catch (e) {
			status.textContent = 'We could not create the image. Check your internet connection and try again.';
			console.error('[oxg] export failed', e);
		}
	}
	$('oxg-download').addEventListener('click', download);
	$('oxg-share').addEventListener('click', async () => {
		try {
			const blob = await makeCard();
			const file = new File([blob], 'oxtech-graduation-card.png', { type: 'image/png' });
			if (navigator.canShare && navigator.canShare({ files: [file] })) {
				status.textContent = '';
				await navigator.share({ files: [file], text: caption() }).catch(() => {});
			} else {
				showSheet(lastURL);
				status.textContent = 'Save the image, then post it with the caption.';
			}
		} catch (e) {
			status.textContent = 'We could not create the image. Check your internet connection and try again.';
			console.error('[oxg] export failed', e);
		}
	});
	$('oxg-copy').addEventListener('click', async e => {
		try { await navigator.clipboard.writeText(caption()); e.target.textContent = 'Caption copied'; }
		catch (_) { prompt('Copy this caption:', caption()); }
	});

	/* start */
	$('oxg-hint').textContent = 'Use a clear, well-lit photo of your face.';
	document.fonts.ready.then(() => { ringText(); update(); }); ringText(); update();
})();
</script>
