	<form class="oxg-form" onsubmit="return false">
		<h2>Your graduation card</h2>
		<p class="oxg-sub">Check your details, add a photo you love, then share it.</p>

		<div class="oxg-names">
			<label>First name <input type="text" id="oxg-in-first" maxlength="20" autocomplete="given-name" placeholder="e.g. Oluebube"></label>
			<label>Last name <input type="text" id="oxg-in-last" maxlength="20" autocomplete="family-name" placeholder="e.g. Ogbodo"></label>
		</div>
		<label id="oxg-course-wrap">Course <select id="oxg-in-course"></select></label>

		<div class="oxg-field">
			<span class="oxg-label">Photo</span>
			<label class="oxg-upload"><input type="file" id="oxg-in-file" accept="image/*"><span>Upload a photo</span></label>
			<label class="oxg-zoom">Zoom <input type="range" id="oxg-in-zoom" min="1" max="3" step="0.01" value="1"></label>
			<p class="oxg-hint" id="oxg-hint"></p>
		</div>

		<div class="oxg-actions">
			<button type="button" class="oxg-primary" id="oxg-share">Share card</button>
			<button type="button" id="oxg-download">Download PNG</button>
			<button type="button" id="oxg-copy">Copy caption</button>
		</div>
		<p class="oxg-status" id="oxg-status" role="status"></p>
	</form>
</div>

<style>
/* ============ PAGE LAYOUT ============ */
.oxg{font-optical-sizing:auto;box-sizing:border-box;width:min(100%,1100px);padding:0 clamp(12px,2vw,24px);display:grid;gap:clamp(24px,4vw,48px);grid-template-columns:minmax(0,460px) minmax(0,520px);justify-content:center;align-items:center;margin:0 auto;font-family:'Bricolage Grotesque',system-ui,sans-serif;color:#111111}
.oxg-stage{position:relative;width:min(100%,460px);justify-self:center;aspect-ratio:1080/1350;overflow:hidden;border-radius:14px;box-shadow:0 20px 50px rgba(0,40,90,.18)}
@media (max-width:900px){
	.oxg{grid-template-columns:minmax(0,1fr);gap:28px}
	.oxg-form{width:min(100%,520px);justify-self:center}
}
@media (max-width:560px){
	.oxg{padding-inline:8px;gap:22px}
	.oxg-stage{border-radius:12px}
	.oxg-form{gap:16px}
	.oxg-form h2{font-size:24px}
	.oxg-actions>button{flex:1 1 100%}
	.oxg-names{grid-template-columns:1fr}
}

/* ============ CARD STYLES (1080 x 1350) ============ */
.oxg-card{font-optical-sizing:auto;position:absolute;left:0;top:0;width:1080px;height:1350px;overflow:hidden;transform-origin:0 0;transform:scale(var(--oxg-scale,.4));color:#fff;font-family:'Bricolage Grotesque',sans-serif;background:#2A8EF8}
.oxg-card *{box-sizing:border-box}
.oxg [hidden]{display:none!important}
.oxg-bg{position:absolute;left:0;top:0;width:1080px!important;height:1350px!important;max-width:none!important}

.oxg-logo{position:absolute;left:420px;top:60px;width:240px;height:auto}
.oxg-logo-text{display:flex;flex-direction:column;align-items:center;gap:2px}
.oxg-logo-text span{font-size:46px;font-weight:400;letter-spacing:3px;line-height:1}
.oxg-logo-text small{font-size:12px;font-weight:600;letter-spacing:15px;margin-right:-15px}

.oxg-polaroid-back{position:absolute;left:250px;top:206px;width:580px;height:690px;background:#F1F4F9;transform:rotate(-5deg);box-shadow:0 20px 40px rgba(0,48,110,.3)}
.oxg-polaroid{position:absolute;left:250px;top:196px;width:580px;height:690px;padding:32px 32px 0;background:#fff;transform:rotate(2.5deg);box-shadow:0 2px 4px rgba(0,48,110,.25),0 30px 60px rgba(0,48,110,.4);display:flex;flex-direction:column;align-items:center}
.oxg-photo{position:relative;width:516px;height:516px;flex:0 0 auto;overflow:hidden;background:#D7DEEA;touch-action:none}
.oxg-photo.has-photo{cursor:grab}
.oxg-photo.has-photo:active{cursor:grabbing}
.oxg-img{position:absolute;max-width:none!important;user-select:none;-webkit-user-drag:none;pointer-events:none}

.oxg-empty svg{display:block;width:100%;height:100%}
.oxg-caption{flex:1;display:flex;align-items:center;padding-bottom:4px;font-family:Caveat,cursive;font-weight:700;font-size:64px;line-height:1;color:#111111;white-space:nowrap}

.oxg-tape{position:absolute;left:440px;top:166px;width:200px;height:58px;background:rgba(255,201,60,.85);transform:rotate(-3deg);clip-path:polygon(0 8%,4% 0,8% 10%,12% 0,88% 0,92% 10%,96% 0,100% 8%,100% 92%,96% 100%,92% 90%,88% 100%,12% 100%,8% 90%,4% 100%,0 92%)}

.oxg-badge{position:absolute;left:765px;top:565px;width:230px;height:230px;transform:rotate(10deg);overflow:visible;filter:drop-shadow(0 12px 14px rgba(0,48,110,.35))}

.oxg-text{position:absolute;left:60px;right:60px;top:982px;display:flex;flex-direction:column;align-items:center;text-align:center}
.oxg-lead{font-size:30px;font-weight:400;color:#EAF3FF}
.oxg-name{margin-top:10px;font-size:86px;font-weight:600;line-height:1.05;letter-spacing:-0.5px;text-transform:capitalize;white-space:nowrap}
.oxg-course{margin-top:14px;font-size:36px;font-weight:600;color:#FFC93C;white-space:nowrap}
.oxg-footer{position:absolute;left:0;right:0;bottom:56px;text-align:center;font-size:20px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:#DCE8FF}

/* ============ FORM ============ */
.oxg-form{display:grid;width:100%;max-width:520px;gap:18px;align-self:center}
.oxg-form h2{margin:0;font-size:30px;font-weight:600}
.oxg-sub{margin:-10px 0 0;opacity:.7}
.oxg-form label,.oxg-label{display:grid;gap:6px;font-size:14px;font-weight:600}
.oxg-form input[type=text],.oxg-form select{padding:12px 14px;border:1px solid #CBD3E3;border-radius:10px;font:400 15px 'Bricolage Grotesque',sans-serif}
.oxg-names{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.oxg-field{display:grid;gap:10px}
.oxg-upload{position:relative;display:flex!important;align-items:center;justify-content:center;min-height:52px;border:2px dashed #92BDFC;border-radius:10px;background:#F4F8FF;color:#2A8EF8;cursor:pointer}
.oxg-upload input[type=file]{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;margin:0!important;padding:0!important;opacity:0!important;display:block!important;cursor:pointer;z-index:2}
.oxg-photo:not(.has-photo){cursor:pointer}
.oxg-zoom{grid-template-columns:auto 1fr;align-items:center}
.oxg-zoom input{accent-color:#2A8EF8}
.oxg-hint,.oxg-status{margin:0;font-size:13px;opacity:.75;min-height:1.2em}
.oxg-actions{display:flex;flex-wrap:wrap;gap:10px}
.oxg-form button{padding:13px 20px;border-radius:10px;border:2px solid #2A8EF8;background:#fff;color:#2A8EF8;font:600 15px 'Bricolage Grotesque',sans-serif;cursor:pointer}
.oxg-form button.oxg-primary{background:#2A8EF8;color:#fff}
.oxg-form :focus-visible,.oxg-upload:focus-within{outline:3px solid #FFC93C;outline-offset:2px}
.oxg-sheet{position:fixed;inset:0;z-index:99999;background:rgba(0,40,90,.7);display:flex;align-items:center;justify-content:center;padding:16px}
.oxg-sheet[hidden]{display:none!important}
.oxg-sheet-box{background:#fff;border-radius:16px;padding:18px;max-width:420px;width:100%;max-height:100%;overflow:auto;font-family:'Bricolage Grotesque',sans-serif;color:#111111;text-align:center}
.oxg-sheet-box img{display:block;width:100%;height:auto;border-radius:10px}
.oxg-sheet-box p{font-size:14px;margin:12px 0}
.oxg-sheet-actions{display:flex;gap:10px;justify-content:center}
.oxg-sheet-actions a,.oxg-sheet-actions button{padding:12px 20px;border-radius:10px;font:600 15px 'Bricolage Grotesque',sans-serif;cursor:pointer;text-decoration:none}
.oxg-sheet-save{background:#2A8EF8;color:#fff!important}
.oxg-sheet-close{background:#fff;color:#2A8EF8;border:2px solid #2A8EF8}
</style>

<script>
(function () {
	const cfg   = {
		name: 'Your Name',
		cohort: 'Wave One Cohort',                 // ← change for each cohort (also change the caption text in the card above)
		courses: ["Artificial Intelligence (AI)", "Content Marketing & SEO", "Cybersecurity", "Data Analysis", "Digital Marketing", "Frontend Development", "Introtech", "Product Design (UI/UX)", "Project Management", "Social Media Management/Marketing", "Virtual Assistant"],
		photo: ''
	};
	const $     = id => document.getElementById(id);
	const card  = $('oxg-card'), stage = card.parentElement;
	const box   = $('oxg-photo'), img = $('oxg-img');
	const firstIn = $('oxg-in-first'), lastIn = $('oxg-in-last'), courseIn = $('oxg-in-course'), zoomIn = $('oxg-in-zoom');
	const fullName = () => [firstIn.value, lastIn.value].map(v => v.trim()).filter(Boolean).join(' ');
	const BOX = 516, TILT = 2.5 * Math.PI / 180;
	let zoom = 1, offX = 0, offY = 0, scale = 1;

	/* background art: turn the inline SVG into a self-contained image so the PNG export keeps the gold foil */
	(function () {
		const svg = card.querySelector('.oxg-bg');
		svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
		const art = new Image();
		art.className = 'oxg-bg'; art.alt = ''; art.setAttribute('aria-hidden', 'true');
		art.width = 1080; art.height = 1350;
		art.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(svg));
		svg.replaceWith(art);
	})();

	/* badge wavy edge */
	let d = '';
	for (let i = 0; i < 360; i++) { const t = i / 180 * Math.PI, r = 104 + 5 * Math.cos(16 * t); d += (i ? 'L' : 'M') + (r * Math.cos(t)).toFixed(2) + ' ' + (r * Math.sin(t)).toFixed(2); }
	document.querySelector('.oxg-badge-edge').setAttribute('d', d + 'Z');

	/* badge ring text: one letter per element (reliable in every browser and in the PNG export) */
	function ringText() {
		const g = document.querySelector('.oxg-badge-ring'), txt = 'CERTIFIED GRADUATE • OXTECH ACADEMY •', R = 70;
		const m = document.createElement('canvas').getContext('2d'); m.font = '700 14px "Bricolage Grotesque", sans-serif';
		g.innerHTML = ''; let a = Math.PI;
		for (const ch of txt) {
			const step = (m.measureText(ch).width + 2.6) / R, mid = a + step / 2;
			const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
			t.setAttribute('transform', `translate(${(R * Math.cos(mid)).toFixed(2)} ${(R * Math.sin(mid)).toFixed(2)}) rotate(${(mid * 180 / Math.PI + 90).toFixed(2)})`);
			t.textContent = ch; g.appendChild(t); a += step;
		}
	}

	/* scale the 1080px card to the preview box */
	function fitStage() { scale = stage.clientWidth / 1080; card.style.setProperty('--oxg-scale', scale); }
	new ResizeObserver(fitStage).observe(stage); fitStage();

	/* shrink text that would overflow */
	function shrink(el, max, size) { el.style.fontSize = size + 'px'; while (el.scrollWidth > max && size > 24) el.style.fontSize = (size -= 2) + 'px'; }

	/* fill details */
	cfg.courses.forEach(c => courseIn.add(new Option(c, c)));
	function update() {
		$('oxg-name').textContent = fullName() || cfg.name;
		$('oxg-course').textContent = courseIn.value;
		shrink($('oxg-name'), 960, 86);
		shrink($('oxg-course'), 960, 36);
		shrink(document.querySelector('.oxg-caption'), 480, 64);
	}
	[firstIn, lastIn].forEach(el => el.addEventListener('input', update));
	courseIn.addEventListener('change', update);

	/* photo: cover-fit, zoom, drag */
	function placePhoto() {
		if (!img.naturalWidth) return;
		const s = Math.max(BOX / img.naturalWidth, BOX / img.naturalHeight) * zoom;
		const w = img.naturalWidth * s, h = img.naturalHeight * s;
		const mx = (w - BOX) / 2, my = (h - BOX) / 2;
		offX = Math.max(-mx, Math.min(mx, offX)); offY = Math.max(-my, Math.min(my, offY));
		Object.assign(img.style, { width: w + 'px', height: h + 'px', left: (BOX - w) / 2 + offX + 'px', top: (BOX - h) / 2 + offY + 'px' });
	}
	const fileIn = $('oxg-in-file'), say = t => { $('oxg-status').textContent = t; };

	function setPhoto(src) {
		img.onload = () => {
			img.hidden = false; $('oxg-empty').hidden = true; box.classList.add('has-photo');
			zoom = 1; zoomIn.value = 1; offX = offY = 0; placePhoto();
			$('oxg-hint').textContent = 'Use zoom, or drag the photo on the card to frame it.';
			say('');
		};
		img.onerror = () => say('That photo could not be opened. Please try a JPG or PNG.');
		if (/^https?:/.test(src)) img.crossOrigin = 'anonymous'; else img.removeAttribute('crossorigin');
		img.src = src;
	}

	/* read the file → shrink very large photos → show on the card */
	function readFile(f) {
		if (!f) return;
		if (/heic|heif/i.test(f.type) || /\.(heic|heif)$/i.test(f.name)) {
			say('This photo is in iPhone HEIC format. Please pick a JPG or PNG, or upload a screenshot of the photo.'); return;
		}
		if (f.type && !/^image\//.test(f.type)) { say('Please choose an image file (JPG or PNG).'); return; }
		say('Loading your photo…');
		const reader = new FileReader();
		reader.onerror = () => say('That photo could not be read. Please try another one.');
		reader.onload = () => {
			const probe = new Image();
			probe.onerror = () => say('That photo could not be opened. Please try a JPG or PNG.');
			probe.onload = () => {
				const max = 1600, k = Math.min(1, max / Math.max(probe.naturalWidth, probe.naturalHeight));
				if (k === 1) return setPhoto(reader.result);
				const c = document.createElement('canvas');
				c.width = Math.round(probe.naturalWidth * k); c.height = Math.round(probe.naturalHeight * k);
				c.getContext('2d').drawImage(probe, 0, 0, c.width, c.height);
				setPhoto(c.toDataURL('image/jpeg', 0.92));
			};
			probe.src = reader.result;
		};
		reader.readAsDataURL(f);
	}
	fileIn.addEventListener('change', () => { readFile(fileIn.files[0]); fileIn.value = ''; });

	/* tap the empty photo on the card to upload, or drag & drop a photo onto it */
	box.addEventListener('click', () => { if (img.hidden) fileIn.click(); });
	[box, document.querySelector('.oxg-upload')].forEach(el => {
		el.addEventListener('dragover', e => { e.preventDefault(); });
		el.addEventListener('drop', e => { e.preventDefault(); readFile(e.dataTransfer.files[0]); });
	});
	zoomIn.addEventListener('input', () => { zoom = +zoomIn.value; placePhoto(); });

	let last = null;
	box.addEventListener('pointerdown', e => { if (img.hidden) return; last = { x: e.clientX, y: e.clientY }; box.setPointerCapture(e.pointerId); });
	box.addEventListener('pointermove', e => {
		if (!last) return;
		const dx = (e.clientX - last.x) / scale, dy = (e.clientY - last.y) / scale;
		offX += dx * Math.cos(TILT) + dy * Math.sin(TILT);
		offY += -dx * Math.sin(TILT) + dy * Math.cos(TILT);
		last = { x: e.clientX, y: e.clientY }; placePhoto();
	});
	['pointerup', 'pointercancel'].forEach(t => box.addEventListener(t, () => { last = null; }));

	/* ---------- export HTML → PNG (with fallbacks) ---------- */
	const status = $('oxg-status');
	const fileName = () => (fullName().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-+|-+$/g, '') || 'Oxtech') + '-Graduation-Card.png';
	const caption = () => `I just completed the ${courseIn.value} programme at Oxtech Academy (${cfg.cohort})! 🎓 Grateful for the journey and excited for what's next. #OxtechAcademy #LearnTechWithOxtech`;
	const toDataURL = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });

	// 1. make sure the export library is loaded (tries 3 CDNs)
	function loadLib() {
		if (window.htmlToImage) return Promise.resolve();
		const urls = ['https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js',
		              'https://unpkg.com/html-to-image@1.11.11/dist/html-to-image.js',
		              'https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.js'];
		return urls.reduce((p, u) => p.catch(() => new Promise((res, rej) => {
			const sc = document.createElement('script'); sc.src = u;
			sc.onload = () => window.htmlToImage ? res() : rej(); sc.onerror = rej; document.head.appendChild(sc);
		})), Promise.reject());
	}

	// 2. embed the logo as data so it can never block the export
	const logoImg = $('oxg-logo');
	const logoReady = (async () => {
		if (!logoImg || logoImg.hidden || /^data:/.test(logoImg.src)) return;
		try { logoImg.src = await toDataURL(await (await fetch(logoImg.src, { mode: 'cors' })).blob()); }
		catch (_) { logoImg.hidden = true; $('oxg-logo-text').hidden = false; }
	})();

	// 3. embed only our own fonts (skips theme stylesheets that can break the export)
	let fontCSS = null;
	async function getFontCSS() {
		if (fontCSS !== null) return fontCSS;
		try {
			let css = await (await fetch('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Caveat:wght@700&display=swap')).text();
			const urls = [...new Set(css.match(/https:[^)]+\.woff2/g) || [])];
			await Promise.all(urls.map(async u => { css = css.split(u).join(await toDataURL(await (await fetch(u)).blob())); }));
			fontCSS = css;
		} catch (_) { fontCSS = ''; }
		return fontCSS;
	}

	async function render() {
		await Promise.all([loadLib(), logoReady, document.fonts.ready]);
		const opts = {
			width: 1080, height: 1350, pixelRatio: 1, cacheBust: true,
			style: { transform: 'none', left: '0', top: '0' },
			fontEmbedCSS: await getFontCSS(),
			imagePlaceholder: 'data:image/gif;base64,R0lGODlhAQABAAAAACw=',
		};
		await htmlToImage.toPng(card, opts);              // warm-up pass (Safari needs it)
		const blob = await htmlToImage.toBlob(card, opts);
		if (!blob || blob.size < 1000) throw new Error('empty');
		return blob;
	}

	// 4. result window: always lets the student save, even where downloads are blocked
	const sheet = document.createElement('div');
	sheet.className = 'oxg-sheet'; sheet.hidden = true;
	sheet.innerHTML = '<div class="oxg-sheet-box" role="dialog" aria-modal="true" aria-label="Your card is ready">' +
		'<img alt="Your graduation card"><p>On a phone? Press and hold the image, then tap <b>Save image</b>.</p>' +
		'<div class="oxg-sheet-actions"><a class="oxg-sheet-save" download="oxtech-graduation-card.png">Save image</a>' +
		'<button type="button" class="oxg-sheet-close">Close</button></div></div>';
	document.body.appendChild(sheet);
	sheet.querySelector('.oxg-sheet-close').onclick = () => { sheet.hidden = true; };
	sheet.addEventListener('click', e => { if (e.target === sheet) sheet.hidden = true; });

	let lastURL = null;
	async function makeCard() {
		status.textContent = 'Preparing your card…';
		const blob = await Promise.race([render(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 25000))]);
		if (lastURL) URL.revokeObjectURL(lastURL);
		lastURL = URL.createObjectURL(blob);
		return blob;
	}
	function showSheet(url) {
		sheet.querySelector('img').src = url; const save = sheet.querySelector('.oxg-sheet-save'); save.href = url; save.download = fileName(); sheet.hidden = false;
	}
	async function download() {
		try {
			await makeCard();
			const a = document.createElement('a'); a.href = lastURL; a.download = fileName();
			document.body.appendChild(a); a.click(); a.remove();
			const inApp = /FBAN|FBAV|Instagram|WhatsApp|Line\/|Snapchat|TikTok|iPhone|iPad/i.test(navigator.userAgent);
			if (inApp) showSheet(lastURL);
			status.textContent = 'Card downloaded. Check your Downloads (or the window that opened).';
		} catch (e) {
			status.textContent = 'We could not create the image. Check your internet connection and try again.';
			console.error('[oxg] export failed', e);
		}
	}
	$('oxg-download').addEventListener('click', download);
	$('oxg-share').addEventListener('click', async () => {
		try {
			const blob = await makeCard();
			const file = new File([blob], fileName(), { type: 'image/png' });
			if (navigator.canShare && navigator.canShare({ files: [file] })) {
				status.textContent = '';
				await navigator.share({ files: [file], text: caption() }).catch(() => {});
			} else {
				showSheet(lastURL);
				status.textContent = 'Save the image, then post it with the caption.';
			}
		} catch (e) {
			status.textContent = 'We could not create the image. Check your internet connection and try again.';
			console.error('[oxg] export failed', e);
		}
	});
	$('oxg-copy').addEventListener('click', async e => {
		try { await navigator.clipboard.writeText(caption()); e.target.textContent = 'Caption copied'; }
		catch (_) { prompt('Copy this caption:', caption()); }
	});

	/* start */
	$('oxg-hint').textContent = 'Use a clear, well-lit photo of your face.';
	document.fonts.ready.then(() => { ringText(); update(); }); ringText(); update();
})();
</script>
